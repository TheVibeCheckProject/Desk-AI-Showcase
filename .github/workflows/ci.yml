# DeskAI CI: the unit tests (screenshot tests included) and Android Lint on every push / PR to main.
# No secrets: the app builds without google-services.json (the Firebase plugin is set to warn), and the tests use
# Robolectric, so nothing runs on a phone or an emulator.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # No Gradle wrapper in the repo (BUILD.md), so CI pins the same Gradle the owner's PC builds with
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.0"

      # Every screen in ScreenshotTest is rendered, so a screen that crashes fails the run. The PNGs aren't
      # pixel-compared here: rendering differs by machine (the Today sky's shader draws on some and not others), so
      # the reference images are reviewed by eye when recorded (gradle recordRoborazziDebug).
      - name: Run unit and screenshot tests
        run: gradle --console=plain testDebugUnitTest

      # Android Lint over the whole app; any error fails the run
      - name: Run Android Lint
        run: gradle --console=plain lintDebug

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
